name: Keep Supabase Awake

# Esegue una piccola query al database ogni 3 giorni, per evitare che Supabase
# metta in pausa il progetto per inattività (succede dopo un po' di giorni senza
# nessuna richiesta, sul piano gratuito).

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query di risveglio verso Supabase
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/room_settings?select=room_code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
