name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collega il progetto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Imposta i secrets delle funzioni (JaaS)
        run: |
          supabase secrets set JAAS_APP_ID="$JAAS_APP_ID"
          supabase secrets set JAAS_KEY_ID="$JAAS_KEY_ID"
          supabase secrets set JAAS_PRIVATE_KEY="$JAAS_PRIVATE_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          JAAS_APP_ID: ${{ secrets.JAAS_APP_ID }}
          JAAS_KEY_ID: ${{ secrets.JAAS_KEY_ID }}
          JAAS_PRIVATE_KEY: ${{ secrets.JAAS_PRIVATE_KEY }}

      - name: Distribuisci la funzione jaas-token
        run: supabase functions deploy jaas-token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
